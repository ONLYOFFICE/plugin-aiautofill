    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm Action</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <link rel="stylesheet" href="styles/themes.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";

            color: var(--color-text);
            background: var(--color-bg-secondary);
        }

        .modal {
            box-sizing: border-box;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 16px;

            background: var(--color-bg-secondary);
            overflow: hidden;
        }

        .modal-content {
            display: flex;
            align-items: center;
            
            gap: 16px;
        }

        .warning-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .warning-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .message {
            flex: 1;
            
            margin: 0;
            
            font-family: Arial, sans-serif;
            font-weight: 400;
            font-size: var(--font-size-base);
            line-height: 16px;
            letter-spacing: 0.02em;
            white-space: pre-wrap;
            word-wrap: break-word;

            color: var(--color-text);
        }
    </style>
</head>
<body>
    <div class="modal" role="dialog" aria-describedby="modal-message">
        <div class="modal-content">
            <div class="warning-icon" aria-hidden="true">
                <img src="resources/icons/info.svg" alt="Info" />
            </div>
            <p id="modal-message" class="message i18n">All data in the document will be replaced with the settings you previously selected. Are you sure you want to proceed?</p>
        </div>
    </div>

    <script src="scripts/utils/theme.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/event.js"></script>
    <script>
        function onThemeChanged(theme) {
            window.Asc.plugin.onThemeChangedBase(theme);
            updateBodyThemeClasses(theme.type, theme.name);
            updateThemeVariables(theme);
        }

        window.Asc.plugin.onThemeChanged = onThemeChanged;

        window.Asc.plugin.init = function() {
            if (window.Asc.plugin.info.theme)
                onThemeChanged(window.Asc.plugin.info.theme);
            
            document.documentElement.classList.add('theme-ready');
            
            window.Asc.plugin.attachEvent("onThemeChanged", onThemeChanged);
        };

        window.Asc.plugin.onTranslate = function() {
            let elements = document.querySelectorAll('.i18n');
            elements.forEach(function(element) {
                if (element.innerText) 
                    element.innerText = window.Asc.plugin.tr(element.innerText.trim());
            });
        };
        
        function setMessage(text) {
            const el = document.getElementById('modal-message');
            if (el && text?.trim())
                el.textContent = text;
        }
        
        const message = window.Autofiller.Utils.getDecodedURLParam('message');
        if (message)
            setMessage(message);
        
        window.Autofiller.EventBus.attachPluginEvent('onSetMessage', (data) => {
            if (data?.message)
                setMessage(data.message);
        });

        function handleConfirm() {
            const storage = window.Autofiller.StorageManager('autofiller');
            window.Autofiller.EventBus.sendAndClose({
                source: 'confirm.html',
                action: 'confirm',
                eventName: 'onConfirmModalAction',
                beforeClose: () => {
                    storage.remove('selected_data');
                    cleanup();
                }
            });
        }

        function handleCancel() {
            window.Autofiller.EventBus.sendAndClose({
                source: 'confirm.html',
                action: 'cancel',
                eventName: 'onConfirmModalAction',
                beforeClose: cleanup
            });
        }

        const messageHandler = (action) => {
            if (action === 'confirm') handleConfirm();
            else if (action === 'cancel') handleCancel();
        };
        
        const buttonHandler = ({ id }) => {
            const isConfirm = [0, '0', 'ok'].includes(id);
            if (isConfirm) handleConfirm();
            else handleCancel();
        };
        
        function cleanup() {
            window.Autofiller.EventBus.off('message', messageHandler);
            window.Autofiller.EventBus.off('button', buttonHandler);
        }
        
        window.Autofiller.EventBus.on('message', messageHandler);
        window.Autofiller.EventBus.on('button', buttonHandler);
        
        window.addEventListener('beforeunload', cleanup);
        
        window.Autofiller.handleConfirm = handleConfirm;
        window.Autofiller.handleCancel = handleCancel;
    </script>
</body>
</html>
