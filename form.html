<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Form filling</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
    <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="vendor/select2-4.0.6-rc.1/dist/js/select2.full.min.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <link rel="stylesheet" href="vendor/select2-4.0.6-rc.1/dist/css/select2.min.css">
    <style>
        body,
        body.theme-light {
            --color-text: #000000;
            --color-text-secondary: #666666;
            --color-bg-primary: #f5f5f5;
            --color-bg-secondary: #ffffff;
            --color-border: #e0e0e0;
            --color-input-bg: #ffffff;
            --color-input-border: #cccccc;
            --color-button-primary: #000000CC;
            --color-button-primary-hover: #000000E6;
            --color-button-secondary-bg: #ffffff;
            --color-button-secondary-border: #C0C0C0;
            --color-button-secondary-hover: #f0f0f0;
            --color-tooltip-bg: #333333;
            --color-tooltip-text: #ffffff;
        }
        
        body.theme-dark {
            --color-text: #e8e8e8;
            --color-text-secondary: #b0b0b0;
            --color-bg-primary: #1e1e1e;
            --color-bg-secondary: #252525;
            --color-border: #3e3e3e;
            --color-input-bg: #2a2a2a;
            --color-input-border: #4a4a4a;
            --color-button-primary: #ffffffE6;
            --color-button-primary-hover: #ffffff;
            --color-button-secondary-bg: #2a2a2a;
            --color-button-secondary-border: #4a4a4a;
            --color-button-secondary-hover: #323232;
            --color-tooltip-bg: #0f0f0f;
            --color-tooltip-text: #e8e8e8;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--color-bg-primary);
            color: var(--color-text);
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            background-color: var(--color-bg-secondary);
            padding: 6px 10px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .panel-title {
            font-family: Arial;
            font-weight: 400;
            font-style: normal;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.02em;
            color: var(--color-text);
            margin: 0;
        }
        
        .panel-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .panel-icon {
            background: none;
            border: 1px solid var(--color-border);
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            font-size: 10px;
            color: var(--color-text-secondary);
            cursor: pointer;
            padding: 0;
        }
        
        .panel-icon:hover {
            background-color: var(--color-bg-primary);
            color: var(--color-text);
        }
        
        .panel-content {
            flex: 1;
            padding: 16px;
            background-color: var(--color-bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            overflow-y: auto;
            min-height: 0;
        }
        
        .content-area {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 0;
            overflow: hidden;
        }
        
        .form-instructions {
            font-family: Arial;
            font-weight: 400;
            font-style: normal;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.02em;
            color: var(--color-text);
            margin-bottom: 12px;
            text-align: left;
            width: 100%;
            flex-shrink: 0;
        }
        
        .form-instructions strong {
            font-weight: 700;
        }
        
        .select-all-container {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            width: 91px;
        }
        
        .checkbox-label-wrapper {
            width: 91px;
            height: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 1;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .select-all-checkbox {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            border: 1px solid var(--color-input-border);
            background-color: var(--color-input-bg);
            border-radius: 2px;
            position: relative;
            margin: 0;
            vertical-align: middle;
        }
        
        .select-all-checkbox:checked {
            background-color: var(--color-text);
            border-color: var(--color-text);
        }
        
        .select-all-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 3px;
            height: 7px;
            border: solid var(--color-bg-primary);
            border-width: 0 2px 2px 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        
        .select-all-checkbox:hover {
            border-color: var(--color-text-secondary);
        }
        
        .select-all-label {
            font-family: Arial;
            font-weight: 400;
            font-style: normal;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.02em;
            color: var(--color-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        
        .divider {
            width: 100%;
            height: 1px;
            background-color: var(--color-border);
            margin: 0 0 8px 0;
            flex-shrink: 0;
        }
        
        .form-fields {
            width: 100%;
            gap: 10px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .form-fields::-webkit-scrollbar {
            display: none;
        }
        
        .form-field {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 1px 0;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }
        
        .field-checkbox {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            border: 1px solid var(--color-input-border);
            background-color: var(--color-input-bg);
            border-radius: 2px;
            position: relative;
            margin: 0;
            vertical-align: middle;
        }
        
        .field-checkbox:checked {
            background-color: var(--color-text);
            border-color: var(--color-text);
        }
        
        .field-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 3px;
            height: 7px;
            border: solid var(--color-bg-primary);
            border-width: 0 2px 2px 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        
        .field-checkbox:hover {
            border-color: var(--color-text-secondary);
        }
        
        .field-label {
            font-family: Arial;
            font-weight: 400;
            font-style: normal;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.02em;
            color: var(--color-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        
        .field-input-container {
            flex: 113;
            min-width: 80px;
            height: 24px;
            justify-content: space-between;
            position: relative;
            display: flex;
            align-items: center;
            opacity: 1;
            margin-right: 4px;
        }
        
        .field-input {
            flex: 1;
            padding: 2px 3px;
            border: 1px solid var(--color-input-border);
            font-family: Arial;
            font-weight: 400;
            font-style: normal;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.02em;
            color: var(--color-text);
            background-color: var(--color-input-bg);
            height: 20px;
            box-sizing: border-box;
            min-width: 0;
            width: 100%;
        }
        
        .select2-container {
            width: 100% !important;
            font-size: 11px;
        }
        
        .select2-container--default .select2-selection--single {
            height: 20px;
            border: 1px solid var(--color-input-border);
            border-radius: 0;
            padding: 0;
            background-color: var(--color-input-bg);
        }
        
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 18px;
            padding-left: 3px;
            padding-right: 14px;
            font-family: Arial;
            font-size: 11px;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 18px;
            right: 1px;
            top: 1px;
        }
        
        .select2-container--default .select2-selection--single .select2-selection__arrow b {
            border-color: var(--color-text-secondary) transparent transparent transparent;
            border-width: 3px 2px 0 2px;
            margin-left: -2px;
            margin-top: -1px;
        }
        
        .select2-dropdown {
            border: 1px solid var(--color-input-border);
            border-radius: 0;
            font-family: Arial;
            font-size: 11px;
            box-sizing: border-box;
            background-color: var(--color-input-bg);
        }
        
        .select2-results__options {
            max-height: 96px !important;
            overflow-y: auto !important;
        }
        
        .select2-results__option {
            padding: 4px 6px;
            font-family: Arial;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            word-wrap: break-word;
            height: 24px;
            line-height: 16px;
            box-sizing: border-box;
            color: var(--color-text);
        }
        
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: var(--color-button-secondary-hover);
            color: var(--color-text);
        }
        
        .select2-container--default .select2-results__option[aria-selected="true"] {
            background-color: var(--color-bg-primary);
            color: var(--color-text);
        }
        
        .select2-search--dropdown {
            padding: 4px;
            background-color: var(--color-input-bg);
        }
        
        .select2-search--dropdown .select2-search__field {
            border: 1px solid var(--color-input-border);
            border-radius: 0;
            font-family: Arial;
            font-size: 11px;
            padding: 2px 4px;
            width: 100%;
            box-sizing: border-box;
            background-color: var(--color-input-bg);
            color: var(--color-text);
        }
        
        .field-icon {
            width: 24px;
            height: 24px;
            border-radius: 1px;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            opacity: 1;
            transition: background-color 0.2s;
        }
        
        .field-icon:hover {
            background-color: var(--color-button-secondary-hover);
        }
        
        .field-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        body.theme-dark .field-icon img {
            content: url('resources/img/button_dark.png');
        }
        
        .field-icon[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: fixed;
            bottom: auto;
            top: var(--tooltip-top, 0);
            left: var(--tooltip-left, 0);
            transform: translate(-50%, -100%);
            margin-bottom: 5px;
            padding: 4px 8px;
            background-color: var(--color-tooltip-bg);
            color: var(--color-tooltip-text);
            font-size: 11px;
            font-family: Arial;
            white-space: nowrap;
            border-radius: 2px;
            z-index: 999999;
            pointer-events: none;
        }
        
        .field-icon[data-tooltip]:hover::before {
            content: '';
            position: fixed;
            bottom: auto;
            top: var(--tooltip-top, 0);
            left: var(--tooltip-left, 0);
            transform: translate(-50%, 0);
            margin-top: -5px;
            border: 5px solid transparent;
            border-top-color: var(--color-tooltip-bg);
            z-index: 999999;
            pointer-events: none;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
            margin-top: 10px;
        }
        
        .btn-primary {
            background-color: var(--color-button-primary);
            color: var(--color-bg-primary);
            border: none;
            border-radius: 1px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            width: 100%;
            height: 24px;
            min-width: 120px;
            padding: 11px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.02em;
            font-family: Arial;
            box-sizing: border-box;
        }
        
        .btn-primary:hover {
            background-color: var(--color-button-primary-hover);
        }
        
        .btn-primary:active {
            background-color: var(--color-button-primary-hover);
            opacity: 0.85;
        }
        
        .btn-secondary {
            background-color: var(--color-button-secondary-bg);
            color: var(--color-text);
            border: 1px solid var(--color-button-secondary-border);
            border-radius: 1px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            width: 100%;
            height: 24px;
            min-width: 120px;
            padding: 11px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.02em;
            font-family: Arial;
            box-sizing: border-box;
        }
        
        .btn-secondary:hover {
            background-color: var(--color-button-secondary-hover);
            border-color: var(--color-text-secondary);
        }
        
        .btn-secondary:active {
            background-color: var(--color-button-secondary-hover);
            opacity: 0.85;
        }
        
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .loader-container.hidden {
            display: none;
        }
        
        .loader {
            text-align: center;
            font-family: Arial;
            font-size: 11px;
            color: var(--color-text);
        }
        
        .loader span {
            display: block;
            margin-top: 10px;
        }
        
        .loader:before {
            content: '';
            display: block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--color-border);
            border-top: 2px solid var(--color-text-secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-primary:disabled,
        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .field-checkbox-label-wrapper {
            flex: 91;
            min-width: 60px;
            height: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 1;
            box-sizing: border-box;
            overflow: hidden;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .empty-state-content {
            text-align: center;
            max-width: 400px;
        }

        .empty-state-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .empty-state-title {
            font-family: Arial;
            font-weight: 600;
            font-size: 16px;
            line-height: 20px;
            color: var(--color-text);
            margin: 0 0 12px 0;
        }

        .empty-state-message {
            font-family: Arial;
            font-weight: 400;
            font-size: 11px;
            line-height: 16px;
            color: var(--color-text-secondary);
            margin: 0 0 24px 0;
        }
    </style>
</head>
<body>
    <div class="loader-container" id="loaderContainer">
        <div class="loader"><span class="i18n">Loading...</span></div>
    </div>
    <div class="panel-content" id="mainWindow">
        <div class="content-area" id="formContent">
            <div class="form-instructions i18n">
                Set the values for each parameter. If it's not necessary, uncheck the checkbox. Then press the Apply button.
            </div>
            
            <div class="select-all-container">
                <div class="checkbox-label-wrapper">
                    <input type="checkbox" class="select-all-checkbox" id="selectAll" checked>
                    <label for="selectAll" class="select-all-label i18n">Select All</label>
                </div>
            </div>
            
            <div class="divider"></div>
            
            <div class="form-fields" id="formFields">
                <!-- Dynamic form fields -->
            </div>
            
            <div class="button-group">
                <button class="btn-primary i18n" id="applyBtn">Apply</button>
                <button class="btn-secondary i18n" id="restartBtn">Restart</button>
            </div>
        </div>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-content">
                <img src="resources/img/warning.png" alt="Warning" class="empty-state-icon">
                <h2 class="empty-state-title i18n">No Data Available</h2>
                <p class="empty-state-message i18n">No form fields were found or no data is available to fill. Please check your data source and try again.</p>
                <button class="btn-secondary i18n" id="restartBtnEmpty">Restart</button>
            </div>
        </div>
    </div>

    <script src="components/Loader/script.js"></script>
    <script src="scripts/utils/theme.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/event.js"></script>
    <script src="scripts/library.js"></script>
    <script src="scripts/extractor.js"></script>
    <script src="scripts/mapper.js"></script>
    <script src="components/Form/script.js"></script>
    <script src="components/ConfirmModal/script.js"></script>
    <script src="scripts/form.js"></script>
    <script>
        window.Asc.plugin.onTranslate = function() {
            let elements = document.querySelectorAll('.i18n');
            elements.forEach(function(element) {
                element.innerText = window.Asc.plugin.tr(element.innerText);
            });
        };
    </script>
</body>
</html>
