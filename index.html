<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Form filling</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
    <script type="text/javascript" src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="components/Loader/script.js"></script>
    <script src="scripts/utils/theme.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/event.js"></script>
    <script src="scripts/library.js"></script>
    <script src="scripts/extractor.js"></script>
    <script src="scripts/mapper.js"></script>
    <script src="scripts/form.js"></script>
    <style>
        html {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.1s ease-in;
        }
        
        html.theme-ready {
            visibility: visible;
            opacity: 1;
        }
        
        * {
            box-sizing: border-box;
        }

        :root {
            --font-family: Arial, sans-serif;
            --font-size: 11px;
            --line-height: 14px;
            --letter-spacing: 0.02em;
            --button-width: 236px;
            --button-height: 24px;
        }
        
        body,
        body.theme-light,
        body.theme-classic-light,
        body.theme-gray {
            --color-text: #000000;
            --color-text-secondary: #666666;
            --color-bg-primary: #f5f5f5;
            --color-bg-secondary: #ffffff;
            --color-border: #e0e0e0;
            --color-button-primary: #000000CC;
            --color-button-primary-hover: #000000E6;
            --color-button-primary-active: #000000;
            --color-button-secondary-bg: #ffffff;
            --color-button-secondary-border: #C0C0C0;
            --color-button-secondary-hover: #f0f0f0;
            --color-button-secondary-active: #e0e0e0;
        }
        
        body.theme-dark {
            --color-text: #e8e8e8;
            --color-text-secondary: #b0b0b0;
            --color-bg-primary: #1e1e1e;
            --color-bg-secondary: #252525;
            --color-border: #3e3e3e;
            --color-button-primary: #ffffffE6;
            --color-button-primary-hover: #ffffff;
            --color-button-primary-active: #ffffffF2;
            --color-button-secondary-bg: #2a2a2a;
            --color-button-secondary-border: #4a4a4a;
            --color-button-secondary-hover: #323232;
            --color-button-secondary-active: #3a3a3a;
        }
        
        body.theme-contrast-dark {
            --color-text: #ffffff;
            --color-text-secondary: #d0d0d0;
            --color-bg-primary: #121212;
            --color-bg-secondary: #1a1a1a;
            --color-border: #404040;
            --color-button-primary: #ffffff;
            --color-button-primary-hover: #ffffffF5;
            --color-button-primary-active: #ffffffEE;
            --color-button-secondary-bg: #242424;
            --color-button-secondary-border: #505050;
            --color-button-secondary-hover: #2c2c2c;
            --color-button-secondary-active: #343434;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: var(--letter-spacing);
            background-color: var(--color-bg-primary);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            background-color: var(--color-bg-secondary);
            padding: 15px 20px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .panel-title {
            font-weight: 400;
            color: var(--color-text);
            margin: 0;
        }
        
        .panel-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--color-text-secondary);
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .panel-close:hover {
            color: var(--color-text);
        }
        
        .panel-content {
            flex: 1;
            padding: 12px;
            background-color: var(--color-bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            overflow-y: auto;
            max-width: 100%;
            box-sizing: border-box;
        }
        
        .text-content {
            color: var(--color-text);
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            word-wrap: break-word;
        }
        
        .description {
            margin-bottom: 20px;
            width: 100%;
            word-wrap: break-word;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
            width: 100%;
        }
        
        .btn {
            border-radius: 1px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            width: 100%;
            height: var(--button-height);
            min-width: 120px;
            padding: 11px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: var(--letter-spacing);
            box-sizing: border-box;
        }
        
        .btn-primary {
            background-color: var(--color-button-primary);
            color: var(--color-bg-primary);
            border: none;
        }
        
        .btn-primary:hover {
            background-color: var(--color-button-primary-hover);
        }
        
        .btn-primary:active {
            background-color: var(--color-button-primary-hover);
            opacity: 0.85;
        }
        
        .btn-secondary {
            background-color: var(--color-button-secondary-bg);
            color: var(--color-text);
            border: 1px solid var(--color-button-secondary-border);
        }
        
        .btn-secondary:hover {
            background-color: var(--color-button-secondary-hover);
            border-color: var(--color-text-secondary);
        }
        
        .btn-secondary:active {
            background-color: var(--color-button-secondary-hover);
            opacity: 0.85;
        }
        
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .loader-container.hidden {
            display: none;
        }
        
        .loader {
            text-align: center;
            font-family: Arial;
            font-size: 11px;
            color: var(--color-text);
        }
        
        .loader span {
            display: block;
            margin-top: 10px;
        }
        
        .loader:before {
            content: '';
            display: block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--color-border);
            border-top: 2px solid var(--color-text-secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn:disabled,
        .btn-primary:disabled,
        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="loader-container hidden" id="loaderContainer"></div>
    <div class="panel-content" id="mainWindow">
        <div id="welcomeContent">
            <div class="text-content i18n">
                Welcome to the autofill plugin!
            </div>
            <div class="text-content description i18n">
                An attempt will be made to automatically fill in the form fields using AI inference. Do you want to start autofilling the forms?
            </div>
            <div class="button-group">
                <button class="btn btn-primary i18n" id="autofillBtn">Autofill</button>
                <button class="btn btn-secondary i18n" id="cancelBtn">Cancel</button>
            </div>
        </div>
        
        <div id="emptyState" style="display: none; text-align: center; padding: 40px 20px;">
            <img src="resources/img/warning.png" alt="Warning" style="width: 64px; height: 64px; margin-bottom: 20px; opacity: 0.7;">
            <h2 class="i18n" style="font-weight: 600; font-size: 16px; margin: 0 0 12px 0;">No Data Available</h2>
            <p class="i18n" style="font-size: 11px; color: var(--color-text-secondary); margin: 0 0 24px 0; line-height: 16px;">No form fields were found or no data is available to fill. Please check your data source and try again.</p>
            <button class="btn btn-secondary i18n" id="retryBtn" style="max-width: 200px; margin: 0 auto;">Restart</button>
        </div>
    </div>
    <script>
        let loader;

        function setButtonsEnabled(enabled) {
            const autofillBtn = document.getElementById('autofillBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            
            if (autofillBtn) autofillBtn.disabled = !enabled;
            if (cancelBtn) cancelBtn.disabled = !enabled;
        }

        function showEmptyState() {
            const welcomeContent = document.getElementById('welcomeContent');
            const emptyState = document.getElementById('emptyState');
            
            if (welcomeContent) welcomeContent.style.display = 'none';
            if (emptyState) emptyState.style.display = 'block';
            
            const retryBtn = document.getElementById('retryBtn');
            if (retryBtn) {
                retryBtn.onclick = null;
                retryBtn.addEventListener('click', () => {
                    handleRestart();
                });
            }
        }

        function handleRestart() {
            const welcomeContent = document.getElementById('welcomeContent');
            const emptyState = document.getElementById('emptyState');
            
            if (emptyState) emptyState.style.display = 'none';
            if (welcomeContent) welcomeContent.style.display = 'block';
            
            handleDetection();
        }

        async function handleDetection() {
            try {
                setButtonsEnabled(false);
                if (loader)
                    loader.show(window.Asc.plugin.tr('Analyzing form fields with AI'));

                const formFields = await window.Autofiller.FormDetectionService.detectAllForms();
                
                if (!formFields || formFields.length === 0) {
                    if (loader) loader.hide();
                    showEmptyState();
                    return;
                }
                
                if (loader)
                    loader.updateMessage(window.Asc.plugin.tr('Fetching data'));

                let realData;
                try {
                    realData = await window.Autofiller.Utils.withTimeout(
                        window.Autofiller.DataExtractor.fetch(),
                        3500,
                        'Data Fetching'
                    );
                } catch (fetchError) {
                    if (fetchError.status && fetchError.status >= 500 && fetchError.status < 600) {
                        if (loader) loader.hide();
                        showEmptyState();
                        return;
                    }
                    throw fetchError;
                }

                if (!realData || (typeof realData === 'object' && Object.keys(realData).length === 0)) {
                    if (loader) loader.hide();
                    showEmptyState();
                    return;
                }

                if (loader)
                    loader.updateMessage(window.Asc.plugin.tr('Checking AI availability'));

                const isAvailable = await new Promise((resolve) => {
                    checkAI(
                        () => resolve(true),
                        () => resolve(false),
                        0
                    );
                });

                if (!isAvailable) {
                    // TODO: Some error state rendering (notification)
                    if (loader) loader.hide();
                    setButtonsEnabled(true);
                    return;
                }
                
                if (loader)
                    loader.updateMessage(window.Asc.plugin.tr('Mapping fields with AI'));

                const dataKeys = window.Autofiller.DataMappingService.extractAllKeys(realData);
                const prompt = window.Autofiller.Prompts.getFieldMappingPrompt(dataKeys, formFields);
                const aiResult = await window.Autofiller.FormService.executeAI(prompt);
                const aiResponse = window.Autofiller.DataMappingService.parseAIResponse(aiResult.text);
                const fieldsWithOptions = window.Autofiller.FormDetectionService.enrichFieldsWithOptions(formFields, aiResponse.mapping, realData);

                const storage = window.Autofiller.StorageManager('autofiller');
                storage.set('form_fields', fieldsWithOptions);
                
                if (loader)
                    loader.updateMessage(window.Asc.plugin.tr('Loading form'));
                
                setTimeout(() => {
                    window.location.href = 'form.html' + (window.Autofiller.getThemeURLParams ? window.Autofiller.getThemeURLParams() : '');
                }, 300);
            } catch (error) {
                console.error("Error detecting form fields", error);
                // TODO: Error state rendering (notification)

                setButtonsEnabled(true);
                if (loader)
                    loader.hide();
            }
        }

        function close() {
            window.Asc.plugin.executeCommand("close", "");
        }

        function checkAI(onSuccess, onError, retryDelay = 1500) {
            const performCheck = () => {
                if (!window.Asc?.plugin?.executeMethod)
                    return false;
                window.Asc.plugin.executeMethod("AI", [{ type: "Actions" }], (data) => {
                    const hasChat = data?.Actions?.some(action => action?.Chat);
                    if (hasChat)
                        if (onSuccess) onSuccess(data);
                    else
                        if (onError) onError({ error: "No Chat action available" });
                });
                return true;
            };

            if (!performCheck() && retryDelay > 0) {
                setTimeout(() => {
                    if (!performCheck() && onError) {
                        onError({ error: "Plugin API not available" });
                    }
                }, retryDelay);
            }
        }

        function onThemeChanged(theme) {
            window.Asc.plugin.onThemeChangedBase(theme);
            updateBodyThemeClasses(theme.type, theme.name);
            updateThemeVariables(theme);
        }

        window.Asc.plugin.onThemeChanged = onThemeChanged;

        window.Asc.plugin.init = function() {
            if (window.Asc.plugin.info.theme)
                onThemeChanged(window.Asc.plugin.info.theme);
            
            document.documentElement.classList.add('theme-ready');
            
            if (typeof window.Autofiller.Loader !== 'undefined')
                loader = new window.Autofiller.Loader('#loaderContainer', '#mainWindow', {
                    translate: function(t) { return window.Asc && window.Asc.plugin && window.Asc.plugin.tr ? window.Asc.plugin.tr(t) : t; },
                    defaultMessage: 'Loading...'
                });

            setButtonsEnabled(false);

            document.getElementById('autofillBtn').addEventListener('click', handleDetection);
            document.getElementById('cancelBtn').addEventListener('click', close);
            
            window.Asc.plugin.attachEvent("onThemeChanged", onThemeChanged);

            let attempts = 0;
            const maxAttempts = 3;
            const runCheckAI = () => {
                attempts++;
                checkAI(() => {
                    setButtonsEnabled(true);
                }, () => {
                    if (attempts < maxAttempts) {
                        const delay = 1500 + Math.random() * 500;
                        setTimeout(runCheckAI, delay);
                    } else {
                        setButtonsEnabled(false);
                    }
                }, 0);
            };

            runCheckAI();
        };

        window.Asc.plugin.onTranslate = function() {
            let elements = document.querySelectorAll('.i18n');
            elements.forEach(function(element) {
                if (element.innerText) 
                    element.innerText = window.Asc.plugin.tr(element.innerText.trim());
            });
        };
    </script>
</body>
</html>
