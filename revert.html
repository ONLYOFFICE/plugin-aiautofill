<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Filling</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
    <script type="text/javascript" src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --font-family: Arial, sans-serif;
            --font-size: 11px;
            --font-size-base: 11px;
            --line-height: 14px;
            --letter-spacing: 0.02em;
            --button-width: 236px;
            --button-height: 24px;
        }

        html {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.1s ease-in;
        }
        
        html.theme-ready {
            opacity: 1;
            visibility: visible;
        }
        
        body,
        body.theme-light.theme-type-light {
            --color-bg-primary: #F7F7F7;
            --color-bg-secondary: #FFFFFF;
            
            --color-text: #000000;
            --color-text-secondary: #666666;
            
            --color-border: #E0E0E0;
            
            --color-button-primary-bg: #444444;
            --color-button-primary-bg-hover: #1C1C1C;
            --color-button-primary-bg-active: #1C1C1C;
            --color-button-primary-bg-disabled: #00000080;
            --color-button-primary-text: #FFFFFF;
            --color-button-primary-text-disabled: #FFFFFF80;
            
            --color-button-secondary-bg: #EFEFEF;
            --color-button-secondary-bg-hover: #D8D8D8;
            --color-button-secondary-bg-active: #C4C4C4;
            --color-button-secondary-border: #C0C0C0;
            --color-button-secondary-border-hover: #C0C0C0;
            --color-button-secondary-text: #000000CC;
        }
        
        body.theme-white.theme-type-light {
            --color-bg-primary: #FFFFFF;
            --color-bg-secondary: #FFFFFF;
            
            --color-text: #000000;
            --color-text-secondary: #666666;
            
            --color-border: #E1E1E1;
            
            --color-button-primary-bg: #4A87E7;
            --color-button-primary-bg-hover: #2566D5;
            --color-button-primary-bg-active: #1E53AE;
            --color-button-primary-bg-disabled: #DCE7FA;
            --color-button-primary-text: #FFFFFF;
            --color-button-primary-text-disabled: #FFFFFF80;
            
            --color-button-secondary-bg: #FAFAFA;
            --color-button-secondary-bg-hover: #EBEBEB;
            --color-button-secondary-bg-active: #D6D6D6;
            --color-button-secondary-border: #D0D0D0;
            --color-button-secondary-border-hover: #D0D0D0;
            --color-button-secondary-text: #383838;
        }
        
        body.theme-classic-light.theme-type-light {
            --color-bg-primary: #F1F1F1;
            --color-bg-secondary: #FFFFFF;
            
            --color-text: #000000;
            --color-text-secondary: #666666;
            
            --color-border: #CFCFCF;
            
            --color-button-primary-bg: #7D858C;
            --color-button-primary-bg-hover: #666D73;
            --color-button-primary-bg-active: #666D73;
            --color-button-primary-bg-disabled: #A5A5A5;
            --color-button-primary-text: #FFFFFF;
            --color-button-primary-text-disabled: #FFFFFF80;
            
            --color-button-secondary-bg: #FFFFFF;
            --color-button-secondary-bg-hover: #D8DADC;
            --color-button-secondary-bg-active: #7D858C;
            --color-button-secondary-border: #CFCFCF;
            --color-button-secondary-border-hover: #CFCFCF;
            --color-button-secondary-text: #000000;
        }
        
        body.theme-night.theme-type-dark {
            --color-bg-primary: #404040;
            --color-bg-secondary: #404040;
            
            --color-text: #FFFFFF;
            --color-text-secondary: #CCCCCC;
            
            --color-border: #686868;
            
            --color-button-primary-bg: #6E9FEC;
            --color-button-primary-bg-hover: #4A87E7;
            --color-button-primary-bg-active: #446ECA;
            --color-button-primary-bg-disabled: #375478;
            --color-button-primary-text: #FFFFFF;
            --color-button-primary-text-disabled: #F3F3F366;
            
            --color-button-secondary-bg: #404040;
            --color-button-secondary-bg-hover: #585858;
            --color-button-secondary-bg-active: #686868;
            --color-button-secondary-border: #686868;
            --color-button-secondary-border-hover: #686868;
            --color-button-secondary-text: #FFFFFF;
        }
        
        body.theme-dark.theme-type-dark {
            --color-bg-primary: #404040;
            --color-bg-secondary: #333333;
            
            --color-text: #FFFFFF;
            --color-text-secondary: #CCCCCC;
            
            --color-border: #666666;
            
            --color-button-primary-bg: #DDDDDD;
            --color-button-primary-bg-hover: #FCFCFC;
            --color-button-primary-bg-active: #FCFCFC;
            --color-button-primary-bg-disabled: #FFFFFF80;
            --color-button-primary-text: #333333;
            --color-button-primary-text-disabled: #33333380;
            
            --color-button-secondary-bg: #333333;
            --color-button-secondary-bg-hover: #555555;
            --color-button-secondary-bg-active: #606060;
            --color-button-secondary-border: #666666;
            --color-button-secondary-border-hover: #666666;
            --color-button-secondary-text: #FFFFFF;
        }
        
        body.theme-contrast-dark.theme-type-dark {
            --color-bg-primary: #2A2A2A;
            --color-bg-secondary: #1E1E1E;
            
            --color-text: #FFFFFF;
            --color-text-secondary: #B8B8B8;
            
            --color-border: #696969;
            
            --color-button-primary-bg: #E6E6E6;
            --color-button-primary-bg-hover: #A6A6A6;
            --color-button-primary-bg-active: #A6A6A6;
            --color-button-primary-bg-disabled: #888888;
            --color-button-primary-text: #1E1E1E;
            --color-button-primary-text-disabled: #1E1E1E80;
            
            --color-button-secondary-bg: #1E1E1E;
            --color-button-secondary-bg-hover: #424242;
            --color-button-secondary-bg-active: #666666;
            --color-button-secondary-border: #696969;
            --color-button-secondary-border-hover: #696969;
            --color-button-secondary-text: #FFFFFF;
        }

        body.theme-light.theme-type-light,
        body.theme-dark.theme-type-dark {
            --font-size: 12px;
            --font-size-base: 12px;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;

            margin: 0;
            padding: 0;

            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: var(--letter-spacing);

            background-color: var(--color-bg-primary);
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;

            padding: 15px 20px;

            border-bottom: 1px solid var(--color-border);
            background-color: var(--color-bg-secondary);
        }
        
        .panel-title {
            margin: 0;

            font-weight: 400;

            color: var(--color-text);
        }
        
        .panel-close {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            font-size: 18px;

            border: none;

            cursor: pointer;
            background: none;
            color: var(--color-text-secondary);
        }
        
        .panel-close:hover {
            color: var(--color-text);
        }
        
        .panel-content {
            box-sizing: border-box;
            max-width: 100%;
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;

            padding: 12px;
            
            overflow-y: auto;
            background-color: var(--color-bg-primary);
        }
        
        .text-content {
            width: 100%;
            
            margin-bottom: 15px;

            text-align: left;
            word-wrap: break-word;

            color: var(--color-text);
        }

        .content-title {
            width: 100%;

            margin-bottom: 10px;

            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 700;
            font-size: var(--font-size-base);
            line-height: 16px;
            letter-spacing: 0.02em;

            word-wrap: break-word;

            color: var(--color-text);
        }
        
        .description {
            width: 100%;

            margin-bottom: 20px;

            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 400;
            font-size: var(--font-size-base);
            line-height: 14px;
            letter-spacing: 0.02em;

            word-wrap: break-word;
        }
        
        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }
        
        .btn {
            box-sizing: border-box;
            height: var(--button-height);
            min-width: 120px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 1px;
            
            padding: 11px 32px;
            
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 700;
            font-size: var(--font-size-base);
            line-height: 16px;
            letter-spacing: 0.02em;
            
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-primary {
            border: 1px solid var(--color-button-primary-bg);

            background-color: var(--color-button-primary-bg);
            color: var(--color-button-primary-text);
        }
        
        .btn-primary:hover {
            background-color: var(--color-button-primary-bg-hover);
        }
        
        .btn-primary:active {
            background-color: var(--color-button-primary-bg-active);
        }

        .loader-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 10000;
            background-color: var(--color-bg-primary);
        }
        
        .loader-container.hidden {
            display: none;
        }
        
        .loader {
            text-align: center;
            font-family: Arial;
            font-size: var(--font-size);

            color: var(--color-text);
        }
        
        .loader span {
            display: block;

            margin-top: 10px;
        }
        
        .loader:before {
            display: block;
            width: 20px;
            height: 20px;

            margin: 0 auto;

            content: '';

            border: 2px solid var(--color-border);
            border-top: 2px solid var(--color-text-secondary);
            border-radius: 50%;

            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-primary:disabled {
            background-color: var(--color-button-primary-bg-disabled);
            color: var(--color-button-primary-text-disabled, var(--color-button-primary-text));
            cursor: not-allowed;
        }

        .btn-secondary {
            border: 1px solid var(--color-button-secondary-border);
            
            color: var(--color-button-secondary-text);
            background-color: var(--color-button-secondary-bg);
        }
        
        .btn-secondary:hover {
            background-color: var(--color-button-secondary-bg-hover);
            border-color: var(--color-button-secondary-border-hover);
            color: var(--color-button-secondary-text);
        }
        
        .btn-secondary:active {
            background-color: var(--color-button-secondary-bg-active);
            border-color: var(--color-button-secondary-border);
            color: var(--color-button-secondary-text);
        }

        .btn-secondary:disabled {
            background-color: var(--color-button-secondary-bg-hover);
            border-color: var(--color-button-secondary-border-hover);
            color: var(--color-button-secondary-text);
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="loader-container" id="loaderContainer">
        <div class="loader"><span class="i18n">Loading...</span></div>
    </div>
    <div class="panel-content">
        <div class="content-title i18n" id="title">The fields have been filled in automatically!</div>
        <div class="text-content description i18n" id="message">You can either continue entering data manually or cancel the automatic filling.</div>
        <div class="button-group">
            <button class="btn btn-primary i18n" id="closeTabBtn">Close Tab</button>
            <button class="btn btn-secondary i18n" id="revertBtn">Cancel autofill</button>
        </div>
    </div>

    <script src="components/Loader/script.js"></script>
    <script src="scripts/utils/theme.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/event.js"></script>
    <script src="scripts/library.js"></script>
    <script src="scripts/form.js"></script>
    <script src="components/Form/script.js"></script>
    <script src="components/RevertModal/script.js"></script>
    <script>
        let loader;
        let revertModal;

        function close() {
            window.Asc.plugin.executeCommand("close", "");
        }

        function showConfirmModal() {
            if (!revertModal) {
                return;
            }

            revertModal.show(handleRevert, () => {});
        }

        async function handleRevert() {
            try {
                if (revertModal) {
                    revertModal.close();
                }

                const storage = window.Autofiller.StorageManager('autofiller');
                const originalData = storage.get('original_data');
                
                if (!originalData || originalData.length === 0) {
                    if (loader) {
                        loader.show(window.Asc.plugin.tr('Redirecting...'));
                    }

                    window.location.href = 'index.html';
                    return;
                }

                if (loader) {
                    loader.show(window.Asc.plugin.tr('Reverting changes...'));
                }

                for (const field of originalData) {
                    try {
                        await window.Autofiller.FormService.setFieldValue(field.fieldId, field.value);
                    } catch (error) {
                        console.error(`Error reverting field ${field.fieldId}:`, error);
                    }
                }

                storage.remove('original_data');
                storage.remove('form_fields');
                storage.remove('selected_data');

                if (loader) {
                    loader.updateMessage(window.Asc.plugin.tr('Done!'));
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error reverting:', error);
                if (loader) {
                    loader.hide();
                }

                if (revertModal) {
                    revertModal.close();
                }

                if (loader) {
                    loader.show(window.Asc.plugin.tr('Redirecting...'));
                }

                window.location.href = 'index.html';
            }
        }

        window.Asc.plugin.button = function(id) {
            if (id === -1) {
                close();
            } else if (id === 0 || id === '0') {
                handleRevert();
            } else {
                if (revertModal) {
                    revertModal.close();
                }
            }
        };

        function onThemeChanged(theme) {
            window.Asc.plugin.onThemeChangedBase(theme);
            updateBodyThemeClasses(theme.type, theme.name);
            updateThemeVariables(theme);
            
            const storage = window.Autofiller.StorageManager('autofiller');
            const themeClass = theme.name || ('theme-' + theme.type);
            storage.set('theme', themeClass);
        }

        window.Asc.plugin.onThemeChanged = onThemeChanged;

        window.Asc.plugin.init = function() {
            if (window.Asc.plugin.info.theme) {
                onThemeChanged(window.Asc.plugin.info.theme);
            }
            
            document.documentElement.classList.add('theme-ready');

            if (typeof window.Autofiller.Loader !== 'undefined') {
                loader = new window.Autofiller.Loader('#loaderContainer', '.panel-content', {
                    translate: function(t) { return window.Asc && window.Asc.plugin && window.Asc.plugin.tr ? window.Asc.plugin.tr(t) : t; },
                    defaultMessage: 'Loading...'
                });
                loader.hide();
            }

            if (typeof window.Autofiller.RevertModal !== 'undefined') {
                revertModal = new window.Autofiller.RevertModal({
                    translate: function(text) {
                        return window.Asc && window.Asc.plugin && window.Asc.plugin.tr 
                            ? window.Asc.plugin.tr(text) 
                            : text;
                    }
                });
            } else {
                console.error('RevertModal not available');
            }
            
            const closeTabBtn = document.getElementById('closeTabBtn');
            if (closeTabBtn) {
                closeTabBtn.addEventListener('click', close);
            }

            const revertBtn = document.getElementById('revertBtn');
            if (revertBtn) {
                revertBtn.addEventListener('click', showConfirmModal);
            }
            
            window.Asc.plugin.attachEvent("onThemeChanged", onThemeChanged);
        };

        window.Asc.plugin.onTranslate = function() {
            let elements = document.querySelectorAll('.i18n');
            elements.forEach(function(element) {
                if (element.innerText) 
                    element.innerText = window.Asc.plugin.tr(element.innerText.trim());
            });
        };
    </script>
</body>
</html>
