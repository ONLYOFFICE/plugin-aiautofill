<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Filling</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
    <script type="text/javascript" src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --font-family: Arial, sans-serif;
            --font-size: 11px;
            --line-height: 14px;
            --letter-spacing: 0.02em;
            --button-width: 236px;
            --button-height: 24px;
        }
        
        body,
        body.theme-light,
        body.theme-classic-light,
        body.theme-gray {
            --color-text: #000000;
            --color-text-secondary: #666666;
            --color-bg-primary: #f5f5f5;
            --color-bg-secondary: #ffffff;
            --color-border: #e0e0e0;
            --color-button-primary: #000000CC;
            --color-button-primary-hover: #000000E6;
            --color-button-primary-active: #000000;
            --color-button-secondary-bg: #ffffff;
            --color-button-secondary-border: #C0C0C0;
            --color-button-secondary-hover: #f0f0f0;
            --color-button-secondary-active: #e0e0e0;
        }
        
        body.theme-dark {
            --color-text: #e8e8e8;
            --color-text-secondary: #b0b0b0;
            --color-bg-primary: #1e1e1e;
            --color-bg-secondary: #252525;
            --color-border: #3e3e3e;
            --color-button-primary: #ffffffE6;
            --color-button-primary-hover: #ffffff;
            --color-button-primary-active: #ffffffF2;
            --color-button-secondary-bg: #2a2a2a;
            --color-button-secondary-border: #4a4a4a;
            --color-button-secondary-hover: #323232;
            --color-button-secondary-active: #3a3a3a;
        }
        
        body.theme-contrast-dark {
            --color-text: #ffffff;
            --color-text-secondary: #d0d0d0;
            --color-bg-primary: #121212;
            --color-bg-secondary: #1a1a1a;
            --color-border: #404040;
            --color-button-primary: #ffffff;
            --color-button-primary-hover: #ffffffF5;
            --color-button-primary-active: #ffffffEE;
            --color-button-secondary-bg: #242424;
            --color-button-secondary-border: #505050;
            --color-button-secondary-hover: #2c2c2c;
            --color-button-secondary-active: #343434;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: var(--letter-spacing);
            background-color: var(--color-bg-primary);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            background-color: var(--color-bg-secondary);
            padding: 15px 20px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .panel-title {
            font-weight: 400;
            color: var(--color-text);
            margin: 0;
        }
        
        .panel-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--color-text-secondary);
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .panel-close:hover {
            color: var(--color-text);
        }
        
        .panel-content {
            flex: 1;
            padding: 12px;
            background-color: var(--color-bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            overflow-y: auto;
            max-width: 100%;
            box-sizing: border-box;
        }
        
        .text-content {
            color: var(--color-text);
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            word-wrap: break-word;
        }
        
        .description {
            margin-bottom: 20px;
            width: 100%;
            word-wrap: break-word;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
            width: 100%;
        }
        
        .btn {
            border-radius: 1px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            width: 100%;
            height: var(--button-height);
            min-width: 120px;
            padding: 11px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: var(--letter-spacing);
            box-sizing: border-box;
        }
        
        .btn-primary {
            background-color: var(--color-button-primary);
            color: var(--color-bg-primary);
            border: none;
        }
        
        .btn-primary:hover {
            background-color: var(--color-button-primary-hover);
        }
        
        .btn-primary:active {
            background-color: var(--color-button-primary-hover);
            opacity: 0.85;
        }

        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--color-bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .loader-container.hidden {
            display: none;
        }
        
        .loader {
            text-align: center;
            font-family: Arial;
            font-size: 11px;
            color: var(--color-text);
        }
        
        .loader span {
            display: block;
            margin-top: 10px;
        }
        
        .loader:before {
            content: '';
            display: block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--color-border);
            border-top: 2px solid var(--color-text-secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="loader-container" id="loaderContainer">
        <div class="loader"><span class="i18n">Loading...</span></div>
    </div>
    <div class="panel-content">
        <div class="text-content description i18n" id="message">The fields have been filled in automatically! You can either continue entering data manually or cancel the automatic filling.</div>
        <div class="button-group">
            <button class="btn btn-primary i18n" id="revertBtn">Cancel autofill</button>
        </div>
    </div>

    <script src="components/Loader/script.js"></script>
    <script src="scripts/utils/theme.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/event.js"></script>
    <script src="scripts/library.js"></script>
    <script src="scripts/form.js"></script>
    <script src="components/Form/script.js"></script>
    <script src="components/RevertModal/script.js"></script>
    <script>
        let loader;
        let revertModal;

        function close() {
            window.Asc.plugin.executeCommand("close", "");
        }

        function showConfirmModal() {
            if (!revertModal) {
                return;
            }

            revertModal.show(handleRevert, () => {});
        }

        async function handleRevert() {
            try {
                if (revertModal) {
                    revertModal.close();
                }

                const storage = window.Autofiller.StorageManager('autofiller');
                const originalData = storage.get('original_data');
                
                if (!originalData || originalData.length === 0) {
                    if (loader) {
                        loader.show(window.Asc.plugin.tr('Redirecting...'));
                    }
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 300);
                    return;
                }

                if (loader) {
                    loader.show(window.Asc.plugin.tr('Reverting changes...'));
                }

                for (const field of originalData) {
                    try {
                        await window.Autofiller.FormService.setFieldValue(field.fieldId, field.value);
                    } catch (error) {
                        console.error(`Error reverting field ${field.fieldId}:`, error);
                    }
                }

                storage.remove('original_data');
                storage.remove('form_fields');
                storage.remove('selected_data');

                if (loader) {
                    loader.updateMessage(window.Asc.plugin.tr('Done!'));
                }

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);
            } catch (error) {
                console.error('Error reverting:', error);
                if (loader) {
                    loader.hide();
                }

                if (revertModal) {
                    revertModal.close();
                }

                if (loader) {
                    loader.show(window.Asc.plugin.tr('Redirecting...'));
                }
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);
            }
        }

        window.Asc.plugin.button = function(id) {
            if (id === -1) {
                close();
            } else if (id === 0 || id === '0') {
                handleRevert();
            } else {
                if (revertModal) {
                    revertModal.close();
                }
            }
        };

        function onThemeChanged(theme) {
            window.Asc.plugin.onThemeChangedBase(theme);
            updateBodyThemeClasses(theme.type, theme.name);
            updateThemeVariables(theme);
            
            const storage = window.Autofiller.StorageManager('autofiller');
            const themeClass = theme.name || ('theme-' + theme.type);
            storage.set('theme', themeClass);
        }

        window.Asc.plugin.onThemeChanged = onThemeChanged;

        window.Asc.plugin.init = function() {
            if (window.Asc.plugin.info.theme) {
                onThemeChanged(window.Asc.plugin.info.theme);
            }

            if (typeof window.Autofiller.Loader !== 'undefined') {
                loader = new window.Autofiller.Loader('#loaderContainer', '.panel-content', {
                    translate: function(t) { return window.Asc && window.Asc.plugin && window.Asc.plugin.tr ? window.Asc.plugin.tr(t) : t; },
                    defaultMessage: 'Loading...'
                });
                loader.hide();
            }

            if (typeof window.Autofiller.RevertModal !== 'undefined') {
                revertModal = new window.Autofiller.RevertModal({
                    translate: function(text) {
                        return window.Asc && window.Asc.plugin && window.Asc.plugin.tr 
                            ? window.Asc.plugin.tr(text) 
                            : text;
                    }
                });
            } else {
                console.error('RevertModal not available');
            }
            
            const revertBtn = document.getElementById('revertBtn');
            if (revertBtn) {
                revertBtn.addEventListener('click', showConfirmModal);
            }
            
            window.Asc.plugin.attachEvent("onThemeChanged", onThemeChanged);
        };

        window.Asc.plugin.onTranslate = function() {
            let elements = document.querySelectorAll('.i18n');
            elements.forEach(function(element) {
                element.innerText = window.Asc.plugin.tr(element.innerText);
            });
        };
    </script>
</body>
</html>
