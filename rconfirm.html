<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm Revert</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <style>
        :root {
            --font-size-base: 11px;
        }

        html {
            visibility: hidden;
            opacity: 0;
        }
        
        html.theme-ready {
            visibility: visible;
            opacity: 1;
        }
        
        body,
        body.theme-light {
            --border-color: #E0E0E0;
            --text-color: #000000;
            --muted-color: #666666;
            --background-white: #FFFFFF;
        }
        
        body.theme-white.theme-type-light {
            --border-color: #E1E1E1;
            --text-color: #000000;
            --muted-color: #666666;
            --background-white: #FFFFFF;
        }
        
        body.theme-classic-light {
            --border-color: #CFCFCF;
            --text-color: #000000;
            --muted-color: #666666;
            --background-white: #FFFFFF;
        }

        body.theme-night.theme-type-dark {
            --border-color: #686868;
            --text-color: #FFFFFF;
            --muted-color: #CCCCCC;
            --background-white: #404040;
        }
        
        body.theme-dark {
            --border-color: #666666;
            --text-color: #FFFFFF;
            --muted-color: #CCCCCC;
            --background-white: #333333;
        }
        
        body.theme-contrast-dark {
            --border-color: #696969;
            --text-color: #FFFFFF;
            --muted-color: #B8B8B8;
            --background-white: #1E1E1E;
        }

        body.theme-light,
        body.theme-dark {
            --font-size-base: 12px;
        }

        html,
        body {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";

            color: var(--text-color);
            background: transparent;
        }

        .modal {
            box-sizing: border-box;
            width: 320px;
            height: 158px;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 16px;

            overflow: hidden;

            background: var(--background-white);
        }

        .modal-content {
            width: 288px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 16px;

            padding: 0;

            border-radius: 2px;
        }

        .warning-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .warning-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .message {
            flex: 1;

            margin: 0;

            font-family: Arial, sans-serif;
            font-weight: 400;
            font-size: var(--font-size-base);
            line-height: 16px;
            letter-spacing: 0.02em;
            white-space: pre-wrap;
            word-wrap: break-word;

            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="modal" role="dialog" aria-describedby="modal-message">
        <div class="modal-content">
            <div class="warning-icon" aria-hidden="true">
                <img src="resources/icons/warning.png" alt="Warning" />
            </div>
            <p id="modal-message" class="message i18n">An unrecorded data in the document will be deleted. Are you sure you want to continue?</p>
        </div>
    </div>

    <script src="scripts/utils/theme.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/event.js"></script>
    <script>
        function onThemeChanged(theme) {
            window.Asc.plugin.onThemeChangedBase(theme);
            updateBodyThemeClasses(theme.type, theme.name);
            updateThemeVariables(theme);
        }

        window.Asc.plugin.onThemeChanged = onThemeChanged;

        window.Asc.plugin.init = function() {
            if (window.Asc.plugin.info.theme)
                onThemeChanged(window.Asc.plugin.info.theme);
            
            document.documentElement.classList.add('theme-ready');
            
            window.Asc.plugin.attachEvent("onThemeChanged", onThemeChanged);
        };

        window.Asc.plugin.onTranslate = function() {
            let elements = document.querySelectorAll('.i18n');
            elements.forEach(function(element) {
                if (element.innerText) 
                    element.innerText = window.Asc.plugin.tr(element.innerText.trim());
            });
        };
        
        function setMessage(text) {
            const el = document.getElementById('modal-message');
            if (el && text?.trim())
                el.textContent = text;
        }
        
        const message = window.Autofiller.Utils.getDecodedURLParam('message');
        if (message)
            setMessage(message);
        
        window.Autofiller.EventBus.attachPluginEvent('onSetMessage', (data) => {
            if (data?.message)
                setMessage(data.message);
        });

        function handleConfirm() {
            window.Autofiller.EventBus.sendAndClose({
                source: 'rconfirm.html',
                action: 'confirm',
                eventName: 'onRevertConfirmAction',
                beforeClose: cleanup
            });
        }

        function handleCancel() {
            window.Autofiller.EventBus.sendAndClose({
                source: 'rconfirm.html',
                action: 'cancel',
                eventName: 'onRevertConfirmAction',
                beforeClose: cleanup
            });
        }

        const messageHandler = (action) => {
            if (action === 'confirm') handleConfirm();
            else if (action === 'cancel') handleCancel();
        };
        
        const buttonHandler = ({ id }) => {
            const isConfirm = [0, '0', 'ok'].includes(id);
            if (isConfirm) handleConfirm();
            else handleCancel();
        };
        
        function cleanup() {
            window.Autofiller.EventBus.off('message', messageHandler);
            window.Autofiller.EventBus.off('button', buttonHandler);
        }
        
        window.Autofiller.EventBus.on('message', messageHandler);
        window.Autofiller.EventBus.on('button', buttonHandler);
        
        window.addEventListener('beforeunload', cleanup);
        
        window.Autofiller.handleConfirm = handleConfirm;
        window.Autofiller.handleCancel = handleCancel;
    </script>
</body>
</html>
